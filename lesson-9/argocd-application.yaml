apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-app
  namespace: argocd
  labels:
    project: lesson-9
spec:
  project: default
  source:
    repoURL: https://github.com/andriy-pro/goit-devops-course.git
    targetRevision: lesson-8-9
    path: lesson-9/charts/django-app
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: django-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

