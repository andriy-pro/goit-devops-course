# ===========================================
# Конфігурація Grafana
# ===========================================

# --- Persistence ---
persistence:
  enabled: false  # Вимкнено для спрощення (dev/test)
  # enabled: true
  # size: 5Gi

# --- Admin credentials ---
adminUser: admin
adminPassword: grafana123  # ⚠️ Змінити на secure password!

# --- Service ---
service:
  type: ClusterIP

# --- Resources ---
resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 250m

# --- Datasources ---
# Автоматичне підключення до Prometheus
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local
        access: proxy
        isDefault: true

# --- Dashboard providers ---
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# --- Preloaded dashboards ---
# Kubernetes cluster dashboard з Grafana.com
dashboards:
  default:
    # Kubernetes Cluster Dashboard
    kubernetes-cluster:
      gnetId: 6417
      revision: 1
      datasource: Prometheus
    
    # Kubernetes Pods Dashboard
    kubernetes-pods:
      gnetId: 6336
      revision: 1
      datasource: Prometheus

# --- Sidecar для ConfigMap dashboards ---
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard

